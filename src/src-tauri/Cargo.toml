[package]
name = "film-unmask"
version = "0.1.0"
edition = "2021"
default-run = "film-unmask"

[lib]
name = "film_engine"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]
verification = []

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
rawler = "0.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
rayon = "1"
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[[bin]]
name = "film-unmask"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "verify-film"
path = "src/bin/verify.rs"
required-features = ["verification"]

[profile.release]
lto = "thin"
codegen-units = 8
